<text x="168.50" y="156.50" font-size="3.3" text-anchor="start" class="txt" font-weight="bold">Warum dieses Bauteil hinterschnittfrei ist</text>
<text x="168.50" y="162.50" font-size="2.65" text-anchor="start" class="txt">Teilungsebene = waagerechte Ebene durch die</text>
<text x="168.50" y="166.50" font-size="2.65" text-anchor="start" class="txt">Bohrungsachse (h = 45 mm), gr&#246;&#223;ter Querschnitt</text>
<text x="168.50" y="170.50" font-size="2.65" text-anchor="start" class="txt">des Lagerauges liegt darin.</text>
<text x="168.50" y="174.50" font-size="2.65" text-anchor="start" class="txt" font-weight="bold">Entscheidend: keine zur Ausheberichtung</text>
<text x="168.50" y="178.50" font-size="2.65" text-anchor="start" class="txt" font-weight="bold">konkave Fl&#228;che im Modell.</text>
<text x="168.50" y="182.50" font-size="2.65" text-anchor="start" class="txt">Lagerauge, Rippe und Platte sind nach au&#223;en</text>
<text x="168.50" y="186.50" font-size="2.65" text-anchor="start" class="txt">konvex bzw. eben; die einzige konkave Fl&#228;che</text>
<text x="168.50" y="190.50" font-size="2.65" text-anchor="start" class="txt">ist die Bohrung &#8212; und die macht der Kern,</text>
<text x="168.50" y="194.50" font-size="2.65" text-anchor="start" class="txt">nicht das Modell. Genau daran ist die</text>
<text x="168.50" y="198.50" font-size="2.65" text-anchor="start" class="txt">Riemenscheibe gescheitert (Ringnut hinter</text>
<text x="168.50" y="202.50" font-size="2.65" text-anchor="start" class="txt">der Kranz-Innenfl&#228;che &#216;54).</text>
<rect x="288.00" y="150.00" width="118.00" height="62.00" class="box" />
<text x="291.50" y="156.50" font-size="3.3" text-anchor="start" class="txt" font-weight="bold">Anforderungscheck</text>
<text x="291.50" y="162.50" font-size="2.65" text-anchor="start" class="txt" font-weight="bold">A2 reales Bauteil &#8212; Stehlager, echtes</text>
<text x="291.50" y="166.50" font-size="2.65" text-anchor="start" class="txt">  Maschinenelement, Funktion plausibel</text>
<text x="291.50" y="170.50" font-size="2.65" text-anchor="start" class="txt" font-weight="bold">A3 mindestens ein Kern &#8212; Bohrung &#216;20</text>
<text x="291.50" y="174.50" font-size="2.65" text-anchor="start" class="txt">  zwingend gekernt, Kern &#216;20 &#215; 60 liegend</text>
<text x="291.50" y="178.50" font-size="2.65" text-anchor="start" class="txt" font-weight="bold">A4 Modell / Kernkasten &#8212; geteiltes Modell,</text>
<text x="291.50" y="182.50" font-size="2.65" text-anchor="start" class="txt">  Teilung durch die Achse, 3D-Druck wie E5</text>
<text x="291.50" y="186.50" font-size="2.65" text-anchor="start" class="txt" font-weight="bold">A5/A6 Zinn &#8212; unver&#228;ndert, ca. 0,43 kg</text>
<text x="291.50" y="190.50" font-size="2.65" text-anchor="start" class="txt" font-weight="bold">E7 zwei Versionen &#8212; F/O bleibt erhalten,</text>
<text x="291.50" y="194.50" font-size="2.65" text-anchor="start" class="txt">  gleiche Au&#223;enkontur, siehe Tabelle unten</text>
<text x="291.50" y="198.50" font-size="2.65" text-anchor="start" class="txt">Kastenpassung: 25 mm Sand seitlich, 35 mm</text>
<text x="291.50" y="202.50" font-size="2.65" text-anchor="start" class="txt">unter der Platte, 45 mm an den Stirnseiten.</text>
<rect x="165.00" y="216.00" width="118.00" height="69.00" class="box" />
<text x="168.50" y="222.50" font-size="3.3" text-anchor="start" class="txt" font-weight="bold">Gie&#223;technik</text>
<text x="168.50" y="228.50" font-size="2.5" text-anchor="start" class="txt" font-weight="bold">Erstarrungsmoduln (M = V/A):</text>
<text x="168.50" y="232.05" font-size="2.5" text-anchor="start" class="txt">Lagerauge 3,9 &#183; Grundplatte 2,6 &#183; Rippe 2,2 mm</text>
<text x="168.50" y="235.60" font-size="2.5" text-anchor="start" class="txt">&#8594; Die dickste Stelle liegt oben, direkt unter</text>
<text x="168.50" y="239.15" font-size="2.5" text-anchor="start" class="txt">dem Speiser. Genau das war bei der Riemen-</text>
<text x="168.50" y="242.70" font-size="2.5" text-anchor="start" class="txt">scheibe nicht erreichbar.</text>
<text x="168.50" y="246.25" font-size="2.5" text-anchor="start" class="txt" font-weight="bold">Speiser: &#216;20 &#8594; M = d/4 = 5,0 mm</text>
<text x="168.50" y="249.80" font-size="2.5" text-anchor="start" class="txt">erforderlich M &#8805; 1,2 &#183; 3,9 = 4,7 mm &#10003;</text>
<text x="168.50" y="253.35" font-size="2.5" text-anchor="start" class="txt" font-weight="bold">Offener Punkt:</text>
<text x="168.50" y="256.90" font-size="2.5" text-anchor="start" class="txt">Der Oberkasten ist 80 mm hoch, der offene</text>
<text x="168.50" y="260.45" font-size="2.5" text-anchor="start" class="txt">Speiser wird dadurch 60 mm lang (ca. 137 g</text>
<text x="168.50" y="264.00" font-size="2.5" text-anchor="start" class="txt">Kreislaufmaterial). Mit einem selbst gebauten</text>
<text x="168.50" y="267.55" font-size="2.5" text-anchor="start" class="txt">40-mm-Oberkasten (A4 verlangt den Bau</text>
<text x="168.50" y="271.10" font-size="2.5" text-anchor="start" class="txt">ohnehin) w&#228;ren es ca. 46 g.</text>
<text x="168.50" y="274.65" font-size="2.5" text-anchor="start" class="txt" font-weight="bold">Kernauftrieb: F = V &#183; &#916;&#961; &#183; g = 0,54 N</text>
<text x="168.50" y="278.20" font-size="2.5" text-anchor="start" class="txt">(&#8776; 55 g) &#8594; Kernmarken 14 mm gen&#252;gen.</text>
<rect x="288.00" y="216.00" width="118.00" height="69.00" class="box" />
<text x="291.50" y="222.50" font-size="3.3" text-anchor="start" class="txt" font-weight="bold">Version F gegen&#252;ber Version O</text>
<text x="291.50" y="228.50" font-size="2.5" text-anchor="start" class="txt" font-weight="bold">Merkmal                V-O            V-F</text>
<text x="291.50" y="232.05" font-size="2.5" text-anchor="start" class="txt">Rippe                      5 mm         2,5 mm</text>
<text x="291.50" y="235.60" font-size="2.5" text-anchor="start" class="txt">Kehlen                    R3               R0 scharf</text>
<text x="291.50" y="239.15" font-size="2.5" text-anchor="start" class="txt">Lagerauge             &#216;40             &#216;48</text>
<text x="291.50" y="242.70" font-size="2.5" text-anchor="start" class="txt">Anschnitt                seitlich       oben a. Rippe</text>
<text x="291.50" y="246.25" font-size="2.5" text-anchor="start" class="txt">Speiser                    &#216;20             keiner</text>
<text x="291.50" y="249.80" font-size="2.5" text-anchor="start" class="txt">Entl&#252;ftung             Windpfeife  keine</text>
<text x="291.50" y="253.35" font-size="2.5" text-anchor="start" class="txt">Gie&#223;temperatur    ca. 280 &#176;C  ca. 240 &#176;C</text>
<text x="291.50" y="256.90" font-size="2.5" text-anchor="start" class="txt" font-weight="bold">Erwartete Fehlerbilder an V-F:</text>
<text x="291.50" y="260.45" font-size="2.5" text-anchor="start" class="txt">Sauglunker im Lagerauge (keine Speisung) &#183;</text>
<text x="291.50" y="264.00" font-size="2.5" text-anchor="start" class="txt">Kaltlauf in der 2,5-mm-Rippe &#183; Warmriss an</text>
