<text x="291.50" y="271.10" font-size="2.5" text-anchor="start" class="txt">punkt) &#183; Gasblasen ohne Entl&#252;ftung.</text>
<text x="291.50" y="274.65" font-size="2.5" text-anchor="start" class="txt" font-weight="bold">Didaktisch neu gegen&#252;ber der Riemenscheibe:</text>
<text x="291.50" y="278.20" font-size="2.5" text-anchor="start" class="txt">Der Knotenpunkt Rippe/Grundplatte ist das</text>
<text x="291.50" y="281.75" font-size="2.5" text-anchor="start" class="txt">Lehrbuchbeispiel f&#252;r Materialanh&#228;ufung.</text>
