<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bachelorprojekt Metallguss — Sprint-Dashboard</title>
<style>
:root{
  --bg:#faf9f7; --panel:#fff; --line:#e4e2dd; --line-soft:#efedea;
  --fg:#1f1f1d; --fg2:#6b6a66;
  --gruen:#3f8f5b; --gelb:#8a6d1f; --rot:#b4453a;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1a1a18;--panel:#232321;--line:#38372f;--line-soft:#2e2e2a;--fg:#e8e6e1;--fg2:#a3a09a;
        --gruen:#68b586;--gelb:#c9a544;--rot:#d97a6e;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
a{color:inherit}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin:0 0 10px}
.sub{font-size:12px;color:var(--fg2);margin-top:3px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2)}
.kpi .v{font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .n{font-size:11px;color:var(--fg2);margin-top:2px}
.bar{height:3px;background:var(--line-soft);border-radius:2px;margin-top:8px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--fg2)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--fg2);border-radius:99px;
  padding:4px 11px;font-size:12px;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--fg2)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:120px}
.colh{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;
  padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:9px}
.cnt{font-weight:500;color:var(--fg2);font-variant-numeric:tabular-nums;font-size:11px}
.card{display:block;text-decoration:none;background:var(--bg);border:1px solid var(--line);
  border-left:3px solid var(--fg2);border-radius:6px;padding:8px 9px;margin-bottom:7px;transition:.12s}
.card:hover{border-color:var(--fg);transform:translateY(-1px)}
.card .id{font-size:10px;letter-spacing:.02em;color:var(--fg2)}
.card .t{font-size:12.5px;margin:3px 0 6px;line-height:1.35}
.card .m{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--fg2)}
.who{display:inline-flex;align-items:center;gap:4px}
.av{width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:8.5px;font-weight:700;color:#fff;flex:none}
.h{font-variant-numeric:tabular-nums;font-weight:500}
.flag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid currentColor;margin-top:5px}
.empty{font-size:11.5px;color:var(--fg2);padding:6px 2px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:5px 0;border-bottom:1px solid var(--line-soft)}
tr:last-child td{border-bottom:none}
td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
footer{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--fg2);line-height:1.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chartbox{width:100%}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox .ax{stroke:var(--line);stroke-width:1}
.chartbox .gr{stroke:var(--line-soft);stroke-width:1}
.chartbox .lbl{fill:var(--fg2);font-size:10px;font-family:inherit}
.chartbox .ideal{fill:none;stroke:var(--fg2);stroke-width:1.2;stroke-dasharray:4 3;opacity:.55}
.chartbox .ist{fill:none;stroke:var(--gruen);stroke-width:2;stroke-linejoin:round}
.chartbox .pt{fill:var(--gruen)}
.legend{display:flex;gap:16px;font-size:11px;color:var(--fg2);margin-top:8px}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid currentColor;vertical-align:middle;margin-right:5px}
@media(max-width:860px){.board{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:520px){.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="ttl">Sprint-Dashboard</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="sub" id="meta"></div>
  </header>

  <div class="kpis" id="kpis"></div>

  <h2>Task Board</h2>
  <div class="toolbar" id="filter"></div>
  <div class="board" id="board"></div>

  <div class="grid2">
    <div class="panel">
      <h2>Burndown</h2>
      <div id="bd" class="chartbox"></div>
      <div class="sub" id="bdnote" style="margin-top:8px"></div>
    </div>
    <div>
      <div class="panel" style="margin-bottom:14px">
        <h2>Aufwand je Person</h2>
        <table id="pers"></table>
      </div>
      <div class="panel" style="margin-bottom:14px">
        <h2>Offene Abgaben</h2>
        <table id="abg"></table>
      </div>
      <div class="panel">
        <h2>Top-Risiken</h2>
        <table id="risk"></table>
      </div>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
(function(){
'use strict';
const D = /*__DATEN__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const editUrl = p => D.meta.repo ? `${D.meta.repo}/blob/${D.meta.branch}/${p.split('/').map(encodeURIComponent).join('/')}` : '#';
let personFilter = null;

/* ---------- Kopf ---------- */
$('#ttl').textContent = `Sprint ${D.sprint.nummer ?? '?'} · Metallguss FtT-Labor`;
$('#sub').innerHTML = `${esc(D.sprint.start||'')}–${esc(D.sprint.ende||'')} · Ziel: ${esc((D.sprint.sprintziel||'').replace(/^"|"$/g,''))}`;
$('#meta').innerHTML = `zuletzt gebaut: ${esc(D.meta.gebaut)}` +
  (D.meta.repo ? ` · <a class="mono" href="${D.meta.repo}">Repository</a>` : '');

/* ---------- Kennzahlen ---------- */
const K = D.kennzahlen, W = D.weiches, topRisiko = D.risiken[0];
const wf = {gruen:'var(--gruen)', gelb:'var(--gelb)', rot:'var(--rot)'};
const kpi = (k,v,n,extra='') => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div>${extra}</div>`;
$('#kpis').innerHTML = [
  kpi('Restaufwand', `${K.offen_h} h`, `von ${K.geplant_h} h geplant`,
      `<div class="bar"><i style="width:${K.geplant_h?Math.round((K.geplant_h-K.offen_h)/K.geplant_h*100):0}%"></i></div>`),
  kpi('Auslastung', K.auslastung!=null?`${K.auslastung} %`:'–', `${K.geplant_h} h / ${K.kapazitaet_h} h Kapazität`),
  kpi('Aufgaben', `${K.erledigt} / ${K.anzahl}`, 'erledigt im Sprint'),
  W ? kpi('Weiches Kriterium',
      `<span class="dot" style="background:${wf[W.status]}"></span>${W.tage} d`,
      `offen seit ${esc(W.seit)} · grün ≤ 7 d`) : '',
  topRisiko ? kpi('Top-Risiko',
      `<span class="dot" style="background:var(--rot)"></span>${esc(topRisiko.id)}`,
      `W×H = ${topRisiko.risikozahl} · ${esc(topRisiko.klasse||'')}`) : ''
].join('');

/* ---------- Filter ---------- */
$('#filter').innerHTML = `<button class="chip" data-p="" aria-pressed="true">Alle</button>` +
  D.personen.map(p=>`<button class="chip" data-p="${esc(p.name)}" aria-pressed="false">
    <span class="dot" style="background:${p.farbe}"></span>${esc(p.name.split(' ')[0])}</button>`).join('');
$('#filter').onclick = e => {
  const b = e.target.closest('.chip'); if(!b) return;
  personFilter = b.dataset.p || null;
  [...$('#filter').children].forEach(c=>c.setAttribute('aria-pressed', c===b));
  renderBoard();
};

/* ---------- Board ---------- */
function karte(a, hinweis){
  const h = a.aufwand_h ? `${a.aufwand_h} h` : '<span title="noch nicht geschätzt">– h</span>';
  const ref = a.schaetzung === 'referenz' ? ' <span title="Referenzschätzung, Planning Poker steht aus">≈</span>' : '';
  return `<a class="card" href="${editUrl(a._pfad)}" style="border-left-color:${a._farbe}">
    <div class="id mono">${esc(a.id)}</div>
    <div class="t">${esc(a.titel)}</div>
    <div class="m">
      <span class="who">${a.verantwortlich?`<span class="av" style="background:${a._farbe}">${esc(a._initialen)}</span>${esc(String(a.verantwortlich).split(' ')[0])}`:'<span style="opacity:.6">nicht zugewiesen</span>'}</span>
      <span class="h">${h}${ref}</span>
    </div>
    ${hinweis||''}
  </a>`;
}
function renderBoard(){
  const pass = a => !personFilter || a.verantwortlich === personFilter;
  let html = '';
  for(const {key,label} of D.meta.spalten){
    const items = D.aufgaben.filter(a=>a.status===key && pass(a));
    const h = items.reduce((s,a)=>s+(a.aufwand_h||0),0);
    html += `<div class="col"><div class="colh"><span>${label}</span><span class="cnt">${items.length}${h?` · ${h} h`:''}</span></div>`
      + (items.length ? items.map(a=>karte(a,
          a.faellig ? `<span class="flag" style="color:var(--rot)">fällig ${esc(a.faellig)}</span>` : '')).join('')
        : `<div class="empty">${key==='erledigt'?'Noch nichts abgeschlossen. Die Definition of Done bewertet das Team.':'leer'}</div>`)
      + `</div>`;
  }
  const bl = D.blockiert.filter(pass);
  html += `<div class="col"><div class="colh"><span>Blockiert</span><span class="cnt">${bl.length}</span></div>`
    + (bl.length ? bl.map(a=>karte(a,
        `<span class="flag" style="color:var(--rot)">wartet auf ${esc(a.blockiert_durch.join(', '))}</span>`)).join('')
      : `<div class="empty">Nichts blockiert.</div>`)
    + `<div class="empty" style="margin-top:6px;font-style:italic">Keine Board-Spalte — abgeleitet aus <span class="mono">blockiert_durch</span>.</div></div>`;
  $('#board').innerHTML = html;
}
renderBoard();

/* ---------- Tabellen ---------- */
$('#pers').innerHTML = D.personen.map(p=>
  `<tr><td><span class="dot" style="background:${p.farbe}"></span>${esc(p.name)}</td><td>${p.offen} / ${p.gesamt} h</td></tr>`).join('')
  || '<tr><td class="empty">niemand zugewiesen</td></tr>';
$('#abg').innerHTML = D.abgaben.map(a=>
  `<tr><td>${esc(a.titel)}</td><td>${esc(a.frist)}</td></tr>`).join('')
  || '<tr><td>keine offenen Abgaben</td></tr>';
$('#risk').innerHTML = D.risiken.map(r=>{
  const f = r.zone==='act'?'var(--rot)':(r.zone==='monitor'?'var(--gelb)':'var(--gruen)');
  return `<tr><td><span class="dot" style="background:${f}"></span><span class="mono">${esc(r.id)}</span> ${esc((r.titel||'').slice(0,46))}${(r.titel||'').length>46?'…':''}</td><td>${r.risikozahl??''}</td></tr>`;
}).join('');

/* ---------- Burndown als Inline-SVG ----------
   Bewusst ohne Chart.js: keine CDN-Abhaengigkeit (die Seite funktioniert auch
   offline als lokale Datei) und keine Resize-Schleife, weil das SVG ueber
   viewBox skaliert statt sich an den Container anzupassen. */
(function burndown(){
  const rows = D.burndown || [];
  const box  = $('#bd');
  if(!rows.length){ box.innerHTML = '<div class="empty">Kein Burndown-Datenblatt gefunden.</div>'; return; }

  const W=480, H=210, L=44, R=10, T=12, B=30;
  const pw = W-L-R, ph = H-T-B;
  const tags = rows.map(r=>r.tag);
  const xMin = Math.min(...tags), xMax = Math.max(...tags);
  const werte = rows.flatMap(r=>[r.ideal, r.ist]).filter(v=>typeof v === 'number');
  const roh = werte.length ? Math.max(...werte) : 100;
  const schritt = Math.pow(10, Math.floor(Math.log10(roh)-0.5)) * 5;
  const yMax = Math.max(schritt, Math.ceil(roh/schritt)*schritt);

  const X = t => L + (xMax===xMin ? 0 : (t-xMin)/(xMax-xMin)) * pw;
  const Y = v => T + ph - (v/yMax) * ph;

  const linie = key => {
    const pts = rows.filter(r=>typeof r[key] === 'number');
    return pts.length < 2 ? '' : 'M' + pts.map(r=>`${X(r.tag).toFixed(1)},${Y(r[key]).toFixed(1)}`).join('L');
  };
  /* Ist-Kurve als Treppe: Aufgaben werden ganz oder gar nicht abgebaut. */
  const treppe = () => {
    const pts = rows.filter(r=>typeof r.ist === 'number');
    if(pts.length < 2) return '';
    let d = `M${X(pts[0].tag).toFixed(1)},${Y(pts[0].ist).toFixed(1)}`;
    for(let i=1;i<pts.length;i++){
      d += `L${X(pts[i].tag).toFixed(1)},${Y(pts[i-1].ist).toFixed(1)}`;
      d += `L${X(pts[i].tag).toFixed(1)},${Y(pts[i].ist).toFixed(1)}`;
    }
    return d;
  };

  const yTicks = [0, yMax/4, yMax/2, yMax*3/4, yMax];
  const gitter = yTicks.map(v=>
    `<line class="gr" x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}"/>`+
    `<text class="lbl" x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`).join('');
  const xLabels = rows.filter((r,i)=> rows.length<=12 || i%2===0).map(r=>
    `<text class="lbl" x="${X(r.tag).toFixed(1)}" y="${H-B+15}" text-anchor="middle">${r.tag}</text>`).join('');
  const punkte = rows.filter(r=>typeof r.ist === 'number').map(r=>
    `<circle class="pt" cx="${X(r.tag).toFixed(1)}" cy="${Y(r.ist).toFixed(1)}" r="2.6"/>`).join('');

  box.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="xMidYMid meet"
          aria-label="Burndown-Chart: Restaufwand in Stunden ueber den Sprinttagen">
       ${gitter}
       <line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${H-B}"/>
       <line class="ax" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/>
       <path class="ideal" d="${linie('ideal')}"/>
       <path class="ist" d="${treppe()}"/>
       ${punkte}
       ${xLabels}
       <text class="lbl" x="${L+pw/2}" y="${H-2}" text-anchor="middle">Sprinttag</text>
       <text class="lbl" x="10" y="${T+ph/2}" text-anchor="middle"
             transform="rotate(-90 10 ${T+ph/2})">Restaufwand [h]</text>
     </svg>
     <div class="legend">
       <span style="color:var(--fg2)"><i style="border-top-style:dashed"></i>Ideal</span>
       <span style="color:var(--gruen)"><i></i>Ist</span>
     </div>`;
})();

$('#bdnote').textContent = D.burndown.some(r=>r.ist!=null)
  ? 'Ist-Werte aus dem Datenblatt in 17_Controlling/Burndown-Chart.md.'
  : 'Noch keine Ist-Werte eingetragen — Datenblatt in 17_Controlling/Burndown-Chart.md täglich pflegen.';

/* ---------- Fuß ---------- */
$('#foot').innerHTML =
  `Diese Seite wird bei jedem Push automatisch neu gebaut. Sie ist ein <strong>Betrachter</strong>, keine Datenquelle — `+
  `geändert wird ausschließlich das Frontmatter der Markdown-Notizen in Obsidian oder direkt auf GitHub. `+
  `Ein Klick auf eine Karte öffnet die zugehörige Datei.<br>`+
  `<span class="mono">≈</span> hinter einem Aufwand bedeutet Referenzschätzung — der Planning Poker im Team steht noch aus.`;
})();
</script>
</body>
</html>
